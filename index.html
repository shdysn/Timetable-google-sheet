<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Timetable - Premium UI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ======================================================== */
        /* ⚡ PREMIUM & COMPACT FLAT UI (iOS INSPIRED) ⚡            */
        /* ======================================================== */
        :root {
            --primary: #4f46e5;
            --primary-glow: rgba(79, 70, 229, 0.15);
            --text-dark: #0f172a;
            --text-muted: #64748b;
            --danger: #ef4444;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-tab: #e2e8f0;
            --border-color: #e2e8f0;
            --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.05);
            --shadow-tab: 0 2px 8px rgba(0, 0, 0, 0.08);
            --radius-bento: 24px;
            --radius-btn: 10px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body { 
            background: var(--bg-body);
            color: var(--text-dark); 
            padding-bottom: 50px; 
            min-height: 100vh;
        }
        
        /* 📱 PREMIUM iOS NAVBAR */
        .navbar-container { position: sticky; top: 15px; z-index: 1000; display: flex; justify-content: center; width: 100%; pointer-events: none; margin-bottom: 25px; padding: 0 15px; }
        .navbar { 
            background: var(--bg-tab); 
            padding: 5px; border-radius: 50px; 
            display: inline-flex; gap: 4px;
            pointer-events: auto;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
            max-width: 100%; overflow-x: auto; scrollbar-width: none;
        }
        .navbar::-webkit-scrollbar { display: none; }
        
        .nav-btn { 
            padding: 8px 24px; 
            border: none; border-radius: 40px; 
            font-weight: 700; font-size: 0.9rem; 
            cursor: pointer; background: transparent; color: var(--text-muted); 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            white-space: nowrap;
        }
        .nav-btn:hover { color: var(--text-dark); }
        .nav-btn.active { background: #ffffff; color: var(--primary); box-shadow: var(--shadow-tab); }

        .page { display: none; padding: 10px 20px; max-width: 1300px; margin: 0 auto; }
        .page.active { display: block; }

        /* 🔲 PANELS */
        .bento-panel { 
            background: var(--bg-card); 
            border-radius: var(--radius-bento); padding: 30px; margin-bottom: 20px; 
            box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); 
        }
        .card-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 20px; color: var(--text-dark); letter-spacing: -0.5px; display: flex; align-items: center; justify-content: space-between; }
        
        /* 🔥 BENTO GRID */
        .bento-grid-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .bento-box { 
            background: #f8fafc; border-radius: 16px; padding: 20px; 
            border: 1px solid var(--border-color);
        }
        .branding-title { display: block; font-weight: 800; color: var(--text-dark); margin-bottom: 15px; font-size: 1.05rem; }
        
        .branding-inputs { display: flex; gap: 12px; flex-wrap: wrap; }
        .input-wrap { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 160px; }
        .input-wrap.small { flex: 0.5; min-width: 90px; }
        .input-wrap label { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        
        /* 🛸 COMPACT INPUTS */
        input[type="text"], input[type="number"] { 
            width: 100%; padding: 10px 14px; border: 1px solid var(--border-color); border-radius: var(--radius-btn); 
            background: #ffffff; color: var(--text-dark); font-weight: 600; font-size: 0.95rem; 
            outline: none; transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="number"]:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        .input-group button { 
            background: var(--text-dark); color: white; border: none; padding: 0 16px; 
            border-radius: var(--radius-btn); font-weight: bold; cursor: pointer; font-size: 1.2rem;
            min-width: 45px; transition: background 0.2s;
        }
        .input-group button:hover { background: var(--primary); }

        /* 🟠 SOLID CHIPS */
        .chip-container { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { background: #ffffff; border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 30px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 6px; color: var(--text-dark); box-shadow: var(--shadow-sm); }
        .chip-icon { font-size: 1rem; }
        .chip-actions { display: flex; gap: 4px; }
        .chip-btn { background: #f1f5f9; color: var(--text-muted); border: none; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .chip-btn.edit:hover { background: var(--primary); color: white; }
        .chip-btn.del:hover { background: var(--danger); color: white; }

        /* 🟣 iOS STYLE TOGGLE SWITCH */
        .toggle-wrapper { display: flex; justify-content: center; margin-bottom: 25px; }
        .toggle-container { 
            display: flex; background: var(--bg-tab); border-radius: 50px; 
            padding: 5px; width: 100%; max-width: 550px; 
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.03); 
        }
        .toggle-btn { 
            flex: 1; padding: 8px 10px; border: none; background: transparent; 
            border-radius: 40px; font-weight: 700; cursor: pointer; 
            color: var(--text-muted); font-size: 0.85rem; transition: 0.3s;
            white-space: nowrap; 
        }
        .toggle-btn.active { background: white; color: var(--primary); box-shadow: var(--shadow-tab); }

        /* 🟡 ASSIGNMENT LAYOUT */
        .duty-layout { display: flex; gap: 20px; align-items: flex-start; }
        .sidebar-list { flex: 1; min-width: 240px; background: #f8fafc; border-radius: 16px; border: 1px solid var(--border-color); overflow: hidden; padding: 8px; }
        .s-btn { width: 100%; text-align: left; padding: 10px 14px; border: none; border-radius: 10px; margin-bottom: 4px; background: transparent; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-dark); font-weight: 600; font-size: 0.85rem; transition: 0.2s; }
        .s-btn:hover { background: #e2e8f0; }
        .s-btn.active { background: white; color: var(--primary); box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); }
        .s-status { font-size: 0.7rem; background: var(--text-dark); color: white; padding: 2px 8px; border-radius: 20px; font-weight: 800; }
        .duty-editor { flex: 3; width: 100%; }
        .duty-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; width: 100%; }
        
        .period-card { background: #ffffff; border: 1px solid var(--border-color); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm); position: relative; z-index: 1; }
        .p-title { align-self: flex-start; background: var(--text-dark); color: white; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 700; margin-bottom: 2px; }

        .co-teacher-row { display: flex; flex-direction: column; gap: 8px; padding: 8px; background: #f8fafc; border-radius: 10px; border: 1px solid var(--border-color); }
        .add-co-btn { background: transparent; color: var(--text-dark); border: 2px dashed var(--border-color); padding: 8px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .add-co-btn:hover { background: var(--primary-glow); border-color: var(--primary); color: var(--primary); }

        /* ✨ FAST COMPACT DROPDOWNS */
        .c-select-wrapper { position: relative; width: 100%; text-align: left; user-select: none; }
        .c-select-display { background: #ffffff; border: 1px solid var(--border-color); padding: 8px 10px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 0.8rem; font-weight: 700; color: var(--text-dark); transition: border 0.2s; }
        .c-select-display svg { color: #94a3b8; width: 14px; height: 14px; }
        .c-select-display:hover { border-color: #cbd5e1; }
        .c-select-display.active { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-glow); }
        .c-select-display.active svg { transform: rotate(180deg); color: var(--primary); }
        .c-select-display.disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; pointer-events: none; }
        
        .c-select-list { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: #ffffff; border: 1px solid var(--border-color); border-radius: 10px; box-shadow: var(--shadow-md); z-index: 100; max-height: 180px; overflow-y: auto; display: none; flex-direction: column; padding: 4px; }
        .c-select-list.show { display: flex; }
        .c-option { padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.8rem; font-weight: 600; color: var(--text-dark); display: flex; align-items: center; justify-content: space-between; margin-bottom: 2px; }
        .c-option:hover { background: #f1f5f9; color: var(--primary); }
        .c-option.selected { background: var(--text-dark); color: #fff; }
        
        .c-select-list::-webkit-scrollbar { width: 4px; }
        .c-select-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        .busy-badge { font-size: 0.6rem; background: var(--danger); color: white; padding: 2px 6px; border-radius: 10px; font-weight: 800; text-transform: uppercase; }
        .reset-btn { display: block; margin: 30px auto; padding: 10px 20px; background: transparent; color: var(--danger); border: 2px solid var(--danger); border-radius: 12px; font-weight: 800; cursor: pointer; font-size: 0.9rem; }
        .reset-btn:hover { background: var(--danger); color: white; }

        @media screen and (max-width: 768px) {
            .page { padding: 5px 10px; }
            .bento-panel { padding: 15px; margin-bottom: 15px; border-radius: 20px; }
            .bento-box { padding: 15px; }
            .card-title { font-size: 1.15rem; margin-bottom: 15px; flex-wrap: wrap; gap: 10px; justify-content: center; text-align: center; }
            .branding-title { font-size: 0.95rem; margin-bottom: 10px; }
            .navbar-container { padding: 0 5px; top: 10px; margin-bottom: 15px; }
            .navbar { width: 100%; justify-content: space-between; padding: 4px; border-radius: 50px; }
            .nav-btn { flex: 1; padding: 8px 5px; font-size: 0.75rem; text-align: center; }
            .toggle-wrapper { margin-bottom: 15px; }
            .toggle-container { border-radius: 50px; padding: 4px; }
            .toggle-btn { padding: 8px 4px; font-size: 0.75rem; }
            input[type="text"], input[type="number"] { padding: 8px 12px; font-size: 0.85rem; }
            .input-group button { font-size: 1rem; min-width: 40px; padding: 0 12px; }
            .duty-layout { flex-direction: column; gap: 15px; }
            .sidebar-list { width: 100%; max-height: 200px; overflow-y: auto; padding: 6px; }
            .duty-grid { grid-template-columns: repeat(auto-fill, minmax(100%, 1fr)); gap: 10px; }
        }

        @media screen and (max-width: 400px) {
            .nav-btn { font-size: 0.65rem; padding: 8px 2px; }
            .toggle-btn { font-size: 0.65rem; padding: 8px 2px; }
            .chip { font-size: 0.75rem; padding: 4px 10px; }
        }

        /* PRINT STYLES */
        .preview-toolbar { max-width: 1122px; margin: 0 auto 20px auto; background: #ffffff; padding: 15px 25px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); width: 95%; }
        .a4-paper { width: 1080px; min-height: 720px; background: white; margin: 0 auto 40px auto; box-shadow: var(--shadow-md); padding: 15px 40px; border-radius: 8px; display: flex; flex-direction: column; transform-origin: top center; border: 1px solid var(--border-color); }
        .doc-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 20px; }
        .doc-school-info h1 { margin: 0; font-size: 26px; font-weight: 800; text-transform: uppercase; color: #000; letter-spacing: 1px; }
        .doc-school-info p { margin: 4px 0 0 0; font-size: 14px; font-weight: 600; color: #333; text-transform: uppercase; }
        .print-table { width: 100%; border-collapse: collapse; table-layout: fixed; border: 2px solid #000; }
        .print-table th, .print-table td { border: 1px solid #999; text-align: center; vertical-align: middle; padding: 6px 4px; }
        .print-table th { background-color: #e5e5e5; color: #000; font-weight: 700; font-size: 11px; border-bottom: 2px solid #000; text-transform: uppercase; }
        .print-table td:first-child { background-color: #f5f5f5; border-right: 2px solid #000; text-align: left; padding-left: 10px; }
        .print-table .cell-top { font-weight: 800; font-size: 12px; color: #000; display: block; margin-bottom: 2px; }
        .print-table .cell-bottom { font-size: 10px; color: #555; display: block; }
        .print-table .free-cell { color: #888; font-style: italic; font-size: 11px; }
        .sig-row { display: flex; justify-content: space-around; margin-top: auto; padding: 15px 30px 0 30px; }
        .sig-line { border-top: 1px solid #000; padding-top: 4px; font-size: 10px; font-weight: bold; text-transform: uppercase; width: 140px; text-align: center; color: #000; }
        .teacher-record { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 15px 0; border-bottom: 1px dashed #cbd5e1; }
        .teacher-record:last-child { border-bottom: none; }
        .master-teacher-title { text-align: center; font-size: 20px; font-weight: 800; color: #334155; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; margin-bottom: 5px; }
        .title-underline { width: 100%; height: 3px; background-color: #60a5fa; margin-bottom: 20px; }
        .teacher-master-table th.dark-header { background-color: #334155 !important; color: white !important; font-size: 11px; padding: 10px 5px !important; border: 1px solid #475569 !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .teacher-master-table td { height: 45px; }
        .subject-text { font-weight: 800; font-size: 12px; color: #0f172a; line-height: 1.2; }
        .class-pill { background-color: #e2e8f0 !important; color: #475569; font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 12px; display: inline-block; margin-top: 4px; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .dash-free { color: #cbd5e1; font-weight: bold; }

        @media print {
            @page { size: A4 landscape; margin: 5mm; }
            body { background: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; color: black; margin: 0; padding: 0; }
            .navbar-container, .preview-toolbar, #page1, #page2, .reset-btn { display: none !important; }
            #page3 { padding: 0 !important; display: block !important; background: white; }
            .a4-paper { zoom: 1 !important; box-shadow: none !important; margin: 0 !important; padding: 5px 15px !important; width: 100% !important; height: 100vh !important; max-height: 200mm !important; page-break-after: always !important; page-break-inside: avoid !important; border: none !important; transform: none !important; display: flex !important; flex-direction: column !important; justify-content: center !important; }
            .print-table th { background-color: #e5e5e5 !important; font-size: 9pt !important; padding: 4px !important; color: black; }
            .print-table td { color: black; padding: 3px !important; }
            .print-table td:first-child { background-color: #f5f5f5 !important; padding-left: 5px !important; }
            .print-table .cell-top { font-size: 9pt !important; }
            .print-table .cell-bottom { font-size: 7.5pt !important; }
            .master-teacher-title { margin: 2px 0 !important; font-size: 12pt !important; }
            .title-underline { margin-bottom: 5px !important; height: 2px !important; }
            .teacher-master-table { height: auto !important; margin-bottom: 0 !important; }
            .teacher-master-table th.dark-header { padding: 4px 2px !important; font-size: 8pt !important; }
            .teacher-master-table td { height: auto !important; padding: 2px 1px !important; line-height: 1.1 !important; }
            .teacher-master-table td:first-child { font-size: 8.5pt !important; padding-left: 4px !important; white-space: nowrap !important; overflow: hidden !important; }
            .subject-text { font-size: 8pt !important; margin-bottom: 0 !important; }
            .class-pill { font-size: 6.5pt !important; padding: 1px 4px !important; margin-top: 1px !important; }
            .teacher-record { flex: 1 1 23% !important; padding: 4px 0 !important; justify-content: center !important; border-bottom: 1px dashed #aaa !important; }
            .teacher-record:last-child { border-bottom: none !important; }
            .teacher-record .print-table th { font-size: 8pt !important; padding: 3px !important; }
            .teacher-record .print-table td { font-size: 8pt !important; padding: 2px !important; }
            .teacher-record .cell-top { font-size: 8pt !important; }
            .teacher-record .cell-bottom { font-size: 7pt !important; }
            .sig-row { margin-top: 10px !important; padding: 0 10px !important; }
            .sig-line { width: 120px !important; font-size: 8pt !important; }
        }
    </style>
</head>
<body>

    <div class="navbar-container no-print">
        <div class="navbar">
            <button class="nav-btn active" id="btn-page1" onclick="switchPage(1)">⚙️ System Setup</button>
            <button class="nav-btn" id="btn-page2" onclick="switchPage(2)">📝 Intelligent Assign</button>
            <button class="nav-btn" style="background:var(--text-dark); color:white;" id="btn-page3" onclick="switchPage(3)">🖨️ Generate Print</button>
        </div>
    </div>

    <!-- PAGE 1: SETUP -->
    <div id="page1" class="page active">
        <div class="bento-panel">
            <div class="card-title">✨ Workspace Configuration</div>
            
            <div class="bento-box" style="margin-bottom: 25px;">
                <span class="branding-title">🏫 Document Branding & Session</span>
                <div class="branding-inputs">
                    <div class="input-wrap">
                        <label>Institute Name</label>
                        <input type="text" id="inp-school-name" placeholder="e.g. THE SMART SCHOOL" oninput="updateSettings()">
                    </div>
                    <div class="input-wrap">
                        <label>Academic Session</label>
                        <input type="text" id="inp-school-session" placeholder="e.g. 2026 - 2027" oninput="updateSettings()">
                    </div>
                    <div class="input-wrap small">
                        <label>Total Periods</label>
                        <input type="number" id="inp-periods" min="1" max="15" onchange="updateSettings()" title="Total Periods per day">
                    </div>
                </div>
            </div>

            <div class="bento-grid-top">
                <div class="bento-box">
                    <div class="branding-title">🏫 Classes & Sections</div>
                    <div class="input-group">
                        <input type="text" id="inp-class" placeholder="Class Name" style="width: 55%;">
                        <input type="text" id="inp-section" placeholder="Sec (Opt)" style="width: 45%;">
                        <button onclick="addClassWithSection()">+</button>
                    </div>
                    <div class="chip-container" id="list-classes"></div>
                </div>
                <div class="bento-box">
                    <div class="branding-title">📚 Subjects</div>
                    <div class="input-group"><input type="text" id="inp-subject" placeholder="Add Subject..."><button onclick="addData('subjects', 'inp-subject')">+</button></div>
                    <div class="chip-container" id="list-subjects"></div>
                </div>
                <div class="bento-box">
                    <div class="branding-title">👨‍🏫 Instructors</div>
                    <div class="input-group"><input type="text" id="inp-teacher" placeholder="Add Teacher..."><button onclick="addData('teachers', 'inp-teacher')">+</button></div>
                    <div class="chip-container" id="list-teachers"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PAGE 2: DUTY ASSIGNER -->
    <div id="page2" class="page">
        <div class="bento-panel">
            <div class="card-title">🧠 Smart Duty Management</div>
            <div class="toggle-wrapper">
                <div class="toggle-container">
                    <button class="toggle-btn active" id="mode-teacher" onclick="setAssignMode('teacher')">👨‍🏫 Instructor View</button>
                    <button class="toggle-btn" id="mode-class" onclick="setAssignMode('class')">🏫 Class View</button>
                    <button class="toggle-btn" id="mode-incharge" onclick="setAssignMode('incharge')">👑 Class Incharges</button>
                </div>
            </div>
            <div class="duty-layout">
                <div class="sidebar-list" id="assign-sidebar"></div>
                <div class="duty-editor" id="duty-editor-panel">
                    <h3 id="editor-title" style="margin-bottom: 20px; color: var(--text-dark); font-weight: 800; font-size: 1.1rem;">Select an item</h3>
                    <div class="duty-grid" id="editor-grid"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- PAGE 3: PRINT PREVIEW -->
    <div id="page3" class="page">
        <div class="preview-toolbar no-print">
            <span style="font-weight: 800; color: var(--text-dark); font-size: 1.1rem;">📄 Auto-Scaled Print Preview</span>
            <button onclick="window.print()" style="background: var(--text-dark); color: white; padding: 10px 20px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 0.9rem; box-shadow: var(--shadow-md);">🖨️ Send to Printer</button>
        </div>

        <div class="a4-paper">
            <div class="doc-header">
                <div class="doc-school-info">
                    <h1 class="print-school-title">MY SMART SCHOOL</h1>
                    <p class="print-school-session">Academic Session: 2026 - 2027</p>
                </div>
            </div>

            <table class="print-table">
                <thead id="thead-master"></thead>
                <tbody id="tbody-classes"></tbody>
            </table>

            <div class="sig-row">
                <div class="sig-line">Prepared By</div>
                <div class="sig-line">Timetable Incharge</div>
                <div class="sig-line">Principal</div>
            </div>
        </div>

        <div class="a4-paper">
            <h2 class="master-teacher-title">INDIVIDUAL TEACHER TIMETABLES</h2>
            <div class="title-underline"></div>
            <table class="print-table teacher-master-table">
                <thead>
                    <tr id="thead-master-teachers"></tr>
                </thead>
                <tbody id="tbody-master-teachers"></tbody>
            </table>
        </div>

        <div id="tbody-teachers-split"></div>
    </div>

    <button class="reset-btn no-print" onclick="factoryReset()">⚠️ Format Workspace (Reset)</button>

<script>
    // 🌐 GOOGLE APPS SCRIPT API URL
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJO1603faHhLKML-uHRFsv2k6ZH9Qx3X3zXqqzhvmXJbG9nUvDb4VyMJB2nYQ6HlE/exec";

    let appData = {};

    function esc(str) { return str.replace(/'/g, "\\'"); }
    const svgCaret = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`;

    function toggleDropdown(el, event) {
        event.stopPropagation();
        if(el.classList.contains('disabled')) return;
        
        let list = el.nextElementSibling;
        let isShowing = list.classList.contains('show');
        
        document.querySelectorAll('.c-select-list').forEach(l => l.classList.remove('show'));
        document.querySelectorAll('.c-select-display').forEach(d => d.classList.remove('active'));
        document.querySelectorAll('.period-card').forEach(p => p.style.zIndex = '1');
        
        if (!isShowing) {
            list.classList.add('show');
            el.classList.add('active');
            let parentCard = el.closest('.period-card');
            if(parentCard) parentCard.style.zIndex = '50';
        }
    }

    document.addEventListener('click', () => {
        document.querySelectorAll('.c-select-list').forEach(l => l.classList.remove('show'));
        document.querySelectorAll('.c-select-display').forEach(d => d.classList.remove('active'));
        document.querySelectorAll('.period-card').forEach(p => p.style.zIndex = '1');
    });

    function sortClasses() { appData.classes.sort((a, b) => b.localeCompare(a, undefined, {numeric: true, sensitivity: 'base'})); }

    // ☁️ Sync to Google Sheets (CORS Fixed with no-cors mode)
    async function syncToGoogleSheets() {
        try {
            await fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // 👈 Solves CORS blocking
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify(appData)
            });
            console.log("Cloud sync request sent!");
        } catch (err) {
            console.error("Cloud sync error:", err);
        }
    }

    window.onload = async function() {
        let loadedFromCloud = false;
        try {
            let res = await fetch(GOOGLE_SCRIPT_URL);
            let cloudData = await res.json();
            if (cloudData && Object.keys(cloudData).length > 0 && cloudData.teachers) {
                appData = cloudData;
                loadedFromCloud = true;
            }
        } catch(e) {
            console.log("Cloud fetch skipped, loading local storage.");
        }

        if(!loadedFromCloud) {
            let saved = localStorage.getItem("ultimateTimetableData_v3");
            if (saved) { appData = JSON.parse(saved); } else {
                appData = JSON.parse(JSON.stringify(defaultData));
                appData.teachers.forEach(t => {
                    if(!appData.teacherRoster[t]) appData.teacherRoster[t] = Array.from({length: appData.totalPeriods}, () => ({ class: "None", subject: "None" }));
                });
            }
        }
        
        if(!appData.schoolName) appData.schoolName = defaultData.schoolName;
        if(!appData.academicSession) appData.academicSession = defaultData.academicSession;
        if(!appData.totalPeriods) appData.totalPeriods = defaultData.totalPeriods;
        
        document.getElementById('inp-school-name').value = appData.schoolName;
        document.getElementById('inp-school-session').value = appData.academicSession;
        document.getElementById('inp-periods').value = appData.totalPeriods;

        sortClasses(); checkRosterIntegrity(); saveData(); 
        if(appData.teachers.length > 0) activeItem = appData.teachers[0];
        renderChips();
    };

    function updateSettings() {
        appData.schoolName = document.getElementById('inp-school-name').value || "MY SMART SCHOOL";
        appData.academicSession = document.getElementById('inp-school-session').value || "Session: 2026 - 2027";
        let newPeriods = parseInt(document.getElementById('inp-periods').value);
        if (newPeriods > 0 && newPeriods <= 15) { appData.totalPeriods = newPeriods; checkRosterIntegrity(); }
        saveData();
    }

    function saveData() { 
        localStorage.setItem("ultimateTimetableData_v3", JSON.stringify(appData)); 
        syncToGoogleSheets();
    }
    
    function checkRosterIntegrity() { 
        appData.teachers.forEach(t => { 
            if (!appData.teacherRoster[t]) appData.teacherRoster[t] = [];
            while(appData.teacherRoster[t].length < appData.totalPeriods) { appData.teacherRoster[t].push({ class: "None", subject: "None" }); }
        }); 
    }
    
    function factoryReset() {
        if(confirm("Warning! This deletes all saved settings. Do you want to reset?")) {
            localStorage.removeItem("ultimateTimetableData_v3"); location.reload();
        }
    }

    function switchPage(pageNum) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`page${pageNum}`).classList.add('active');
        document.getElementById(`btn-page${pageNum}`).classList.add('active');
        if (pageNum === 2) { setAssignMode(assignMode); }
        if (pageNum === 3) { renderTimetables(); }
        window.scrollTo(0, 0);
    }

    function renderChips() {
        const icons = { 'classes': '🏫', 'subjects': '📚', 'teachers': '👨‍🏫' };
        ['classes', 'subjects', 'teachers'].forEach(type => {
            document.getElementById(`list-${type}`).innerHTML = appData[type].map(item => `
                <div class="chip">
                    <span class="chip-icon">${icons[type]}</span>
                    <span>${item}</span>
                    <div class="chip-actions">
                        <button class="chip-btn edit" onclick="editData('${type}', '${esc(item)}')" title="Edit">✏️</button>
                        <button class="chip-btn del" onclick="removeItem('${type}', '${esc(item)}')" title="Delete">×</button>
                    </div>
                </div>
            `).join('');
        });
    }

    function addData(type, inputId) {
        let val = document.getElementById(inputId).value.trim();
        if (val && !appData[type].includes(val)) {
            appData[type].push(val);
            if (type === 'classes') { appData.incharges[val] = "None"; sortClasses(); }
            if (type === 'teachers') { appData.teacherRoster[val] = Array.from({length: appData.totalPeriods}, () => ({ class: "None", subject: "None" })); }
            saveData(); renderChips(); document.getElementById(inputId).value = "";
        }
    }

    function addClassWithSection() {
        let clsVal = document.getElementById('inp-class').value.trim();
        let secVal = document.getElementById('inp-section').value.trim();
        if(!clsVal) return;
        let finalName = secVal ? `${clsVal} - ${secVal}` : clsVal;
        
        if (!appData.classes.includes(finalName)) {
            appData.classes.push(finalName);
            appData.incharges[finalName] = "None";
            sortClasses(); saveData(); renderChips();
            document.getElementById('inp-class').value = "";
            document.getElementById('inp-section').value = "";
        } else {
            alert(`"${finalName}" already exists!`);
        }
    }

    function editData(type, oldName) {
        let newName = prompt(`Enter new name for ${oldName}:`, oldName);
        if (!newName) return; 
        newName = newName.trim();
        if (newName === oldName || newName === "") return;
        if (appData[type].includes(newName)) { alert(`"${newName}" already exists in the list!`); return; }
        
        let index = appData[type].indexOf(oldName);
        if (index !== -1) { appData[type][index] = newName; }

        if (type === 'classes') {
            appData.incharges[newName] = appData.incharges[oldName]; delete appData.incharges[oldName];
            for (let t in appData.teacherRoster) { appData.teacherRoster[t].forEach(period => { if (period.class === oldName) period.class = newName; }); }
            sortClasses(); if (assignMode === 'class' && activeItem === oldName) activeItem = newName;
        }
        else if (type === 'subjects') {
            for (let t in appData.teacherRoster) { appData.teacherRoster[t].forEach(period => { if (period.subject === oldName) period.subject = newName; }); }
        }
        else if (type === 'teachers') {
            for (let c in appData.incharges) { if (appData.incharges[c] === oldName) appData.incharges[c] = newName; }
            appData.teacherRoster[newName] = appData.teacherRoster[oldName]; delete appData.teacherRoster[oldName];
            if (assignMode === 'teacher' && activeItem === oldName) activeItem = newName;
        }
        saveData(); renderChips();
        if(document.getElementById('page2').classList.contains('active')) { setAssignMode(assignMode); }
    }

    function removeItem(type, item) {
        if (!confirm(`Delete ${item}?`)) return;
        appData[type] = appData[type].filter(i => i !== item);
        if (type === 'teachers') { delete appData.teacherRoster[item]; activeItem = appData.teachers[0] || null; }
        saveData(); renderChips();
    }

    function setAssignMode(mode) {
        assignMode = mode; extraClassRows = {}; 
        document.getElementById('mode-teacher').classList.toggle('active', mode === 'teacher');
        document.getElementById('mode-class').classList.toggle('active', mode === 'class');
        document.getElementById('mode-incharge').classList.toggle('active', mode === 'incharge');
        const sidebar = document.getElementById('assign-sidebar');

        if (mode === 'incharge') { sidebar.style.display = 'none'; renderInchargesView(); } 
        else {
            sidebar.style.display = 'block'; 
            if (mode === 'teacher') activeItem = appData.teachers.length > 0 ? appData.teachers[0] : null;
            if (mode === 'class') activeItem = appData.classes.length > 0 ? appData.classes[0] : null;
            renderAssignSidebar(); renderAssignEditor();
        }
    }

    function renderInchargesView() {
        document.getElementById("editor-title").innerHTML = `👑 Assign Class Incharges <span style="font-size:0.8rem; color:var(--text-muted); font-weight:normal; display:block; margin-top:5px;">Select the main class teacher</span>`;
        const grid = document.getElementById("editor-grid");
        grid.innerHTML = appData.classes.map(cls => {
            let val = appData.incharges[cls];
            let text = val === 'None' ? '-- Select Incharge --' : val;
            let optsHtml = `<div class="c-option ${val==='None'?'selected':''}" onclick="updateIncharge('${esc(cls)}', 'None')">-- Select Incharge --</div>`;
            appData.teachers.forEach(t => { optsHtml += `<div class="c-option ${val===t?'selected':''}" onclick="updateIncharge('${esc(cls)}', '${esc(t)}')">${t}</div>`; });
            return `
            <div class="period-card" style="border-top: 4px solid var(--primary); text-align: center; padding: 25px 15px;">
                <div style="background: var(--bg-body); color: var(--text-dark); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; margin: 0 auto 15px auto; border: 1px solid var(--border-color);">🏫</div>
                <div style="font-size: 1.1rem; font-weight: 800; color: var(--text-dark); margin-bottom: 20px;">${cls}</div>
                <div class="c-select-wrapper">
                    <div class="c-select-display" onclick="toggleDropdown(this, event)"><span>${text}</span> ${svgCaret}</div>
                    <div class="c-select-list">${optsHtml}</div>
                </div>
            </div>`;
        }).join('');
    }

    function updateIncharge(cls, teacher) { appData.incharges[cls] = teacher; saveData(); renderInchargesView(); }
    function selectItem(name) { activeItem = name; extraClassRows = {}; renderAssignSidebar(); renderAssignEditor(); }

    function renderAssignSidebar() {
        let listHtml = "";
        if (assignMode === 'teacher') {
            listHtml = appData.teachers.map(t => {
                let count = appData.teacherRoster[t].filter(d => d.class !== 'None').length;
                return `<button class="s-btn ${t === activeItem ? 'active' : ''}" onclick="selectItem('${esc(t)}')"><span class="t-name">${t}</span><span class="s-status">${count}/${appData.totalPeriods}</span></button>`;
            }).join('');
        } else if (assignMode === 'class') {
            listHtml = appData.classes.map(c => {
                let count = 0;
                for (let p = 0; p < appData.totalPeriods; p++) { if (appData.teachers.some(t => appData.teacherRoster[t][p].class === c)) count++; }
                return `<button class="s-btn ${c === activeItem ? 'active' : ''}" onclick="selectItem('${esc(c)}')"><span class="t-name">${c}</span><span class="s-status" style="background:var(--primary)">${count}/${appData.totalPeriods}</span></button>`;
            }).join('');
        }
        document.getElementById("assign-sidebar").innerHTML = listHtml;
    }

    function renderAssignEditor() {
        const grid = document.getElementById("editor-grid");
        if (!activeItem) { grid.innerHTML = ""; document.getElementById("editor-title").innerText = "No item selected"; return; }
        let html = "";
        
        if (assignMode === 'teacher') {
            document.getElementById("editor-title").innerHTML = `Viewing duties for: <span style="color:var(--primary)">${activeItem}</span>`;
            for (let p = 0; p < appData.totalPeriods; p++) {
                let duty = appData.teacherRoster[activeItem][p];
                let cVal = duty.class; let cText = cVal === 'None' ? '-- Free --' : cVal;
                let cOpts = `<div class="c-option ${cVal==='None'?'selected':''}" onclick="updateTeacherDuty(${p}, 'class', 'None')">-- Free --</div>`;
                appData.classes.forEach(c => cOpts += `<div class="c-option ${cVal===c?'selected':''}" onclick="updateTeacherDuty(${p}, 'class', '${esc(c)}')">${c}</div>`);

                let sVal = duty.subject; let sText = sVal === 'None' ? '-- Subject --' : sVal; let sDisabled = cVal === 'None' ? 'disabled' : '';
                let sOpts = `<div class="c-option ${sVal==='None'?'selected':''}" onclick="updateTeacherDuty(${p}, 'subject', 'None')">-- Subject --</div>`;
                appData.subjects.forEach(s => sOpts += `<div class="c-option ${sVal===s?'selected':''}" onclick="updateTeacherDuty(${p}, 'subject', '${esc(s)}')">${s}</div>`);

                html += `<div class="period-card"><div class="p-title">Period ${p + 1}</div>
                    <div class="c-select-wrapper"><div class="c-select-display" onclick="toggleDropdown(this, event)"><span>${cText}</span>${svgCaret}</div><div class="c-select-list">${cOpts}</div></div>
                    <div class="c-select-wrapper"><div class="c-select-display ${sDisabled}" onclick="toggleDropdown(this, event)"><span>${sText}</span>${svgCaret}</div><div class="c-select-list">${sOpts}</div></div>
                </div>`;
            }
        } 
        else if (assignMode === 'class') {
            document.getElementById("editor-title").innerHTML = `Viewing duties for: <span style="color:var(--primary)">${activeItem}</span>`;
            for (let p = 0; p < appData.totalPeriods; p++) {
                let assignedTeachers = appData.teachers.filter(t => appData.teacherRoster[t][p].class === activeItem);
                let blanks = extraClassRows[p] || 0; let totalRows = assignedTeachers.length + blanks; if (totalRows === 0) totalRows = 1; 

                html += `<div class="period-card"><div class="p-title">Period ${p + 1}</div>`;
                for(let i=0; i < assignedTeachers.length; i++) { html += generateClassDropdown(p, assignedTeachers[i], appData.teacherRoster[assignedTeachers[i]][p].subject); }
                for(let i=0; i < (totalRows - assignedTeachers.length); i++) { html += generateClassDropdown(p, 'None', 'None'); }
                html += `<button class="add-co-btn" onclick="addCombineClassRow(${p})">➕ Assign Co-Teacher</button></div>`;
            }
        }
        grid.innerHTML = html;
    }

    function generateClassDropdown(p, oldTeacher, currentSubject) {
        let tVal = oldTeacher; let tText = tVal === 'None' ? '-- Free (No Teacher) --' : tVal;
        let tOpts = `<div class="c-option ${tVal==='None'?'selected':''}" onclick="updateClassTeacher(${p}, '${esc(oldTeacher)}', 'None')">-- Free (No Teacher) --</div>`;
        appData.teachers.forEach(t => { 
            let isBusy = (appData.teacherRoster[t][p].class !== 'None' && appData.teacherRoster[t][p].class !== activeItem);
            let busyBadge = isBusy ? `<span class="busy-badge">Busy</span>` : '';
            tOpts += `<div class="c-option ${t === tVal ? 'selected' : ''}" onclick="updateClassTeacher(${p}, '${esc(oldTeacher)}', '${esc(t)}')"><span>${t}</span> ${busyBadge}</div>`; 
        });

        let sVal = currentSubject; let sText = sVal === 'None' ? '-- Subject --' : sVal; let sDisabled = tVal === 'None' ? 'disabled' : '';
        let sOpts = `<div class="c-option ${sVal==='None'?'selected':''}" onclick="updateClassSubject(${p}, '${esc(oldTeacher)}', 'None')">-- Subject --</div>`;
        appData.subjects.forEach(s => sOpts += `<div class="c-option ${sVal===s?'selected':''}" onclick="updateClassSubject(${p}, '${esc(oldTeacher)}', '${esc(s)}')">${s}</div>`);

        return `<div class="co-teacher-row">
            <div class="c-select-wrapper"><div class="c-select-display" onclick="toggleDropdown(this, event)"><span>${tText}</span>${svgCaret}</div><div class="c-select-list">${tOpts}</div></div>
            <div class="c-select-wrapper"><div class="c-select-display ${sDisabled}" onclick="toggleDropdown(this, event)"><span>${sText}</span>${svgCaret}</div><div class="c-select-list">${sOpts}</div></div>
        </div>`;
    }

    function addCombineClassRow(p) { if(!extraClassRows[p]) extraClassRows[p] = 0; extraClassRows[p]++; renderAssignEditor(); }
    
    function updateTeacherDuty(p, type, val) { 
        appData.teacherRoster[activeItem][p][type] = val; 
        if (type === 'class' && val === 'None') appData.teacherRoster[activeItem][p].subject = 'None'; 
        saveData(); renderAssignEditor(); renderAssignSidebar(); 
    }
    
    function updateClassTeacher(p, oldTeacher, newTeacher) { 
        if (newTeacher !== 'None' && appData.teacherRoster[newTeacher][p].class !== 'None' && appData.teacherRoster[newTeacher][p].class !== activeItem) {
            if(!confirm(`⚠️ WARNING: ${newTeacher} is already teaching ${appData.teacherRoster[newTeacher][p].class} in Period ${p+1}.\n\nDo you want to override?`)) return; 
        }
        if (oldTeacher !== 'None') { appData.teacherRoster[oldTeacher][p] = { class: 'None', subject: 'None' }; } 
        if (newTeacher !== 'None') { appData.teacherRoster[newTeacher][p] = { class: activeItem, subject: (oldTeacher !== 'None') ? appData.teacherRoster[oldTeacher]?.[p]?.subject || 'None' : 'None' }; } 
        extraClassRows[p] = 0; saveData(); renderAssignEditor(); renderAssignSidebar(); 
    }
    
    function updateClassSubject(p, teacherName, newSubject) { if (teacherName && teacherName !== 'None') { appData.teacherRoster[teacherName][p].subject = newSubject; saveData(); renderAssignEditor(); renderAssignSidebar(); } }

    function chunkArray(arr, size) { let res = []; for(let i = 0; i < arr.length; i += size) { res.push(arr.slice(i, i + size)); } return res; }

    function renderTimetables() {
        document.querySelectorAll('.print-school-title').forEach(el => el.innerText = appData.schoolName);
        document.querySelectorAll('.print-school-session').forEach(el => el.innerText = appData.academicSession);

        // 1. MASTER CLASS TIMETABLE
        let masterHeaders = `<tr><th style="width:13%">Class Info</th>`;
        for(let p = 0; p < appData.totalPeriods; p++) masterHeaders += `<th>Period ${p + 1}</th>`;
        masterHeaders += `</tr>`; document.getElementById("thead-master").innerHTML = masterHeaders;

        document.getElementById("tbody-classes").innerHTML = appData.classes.map(cls => {
            let row = `<tr><td><span class="cell-top">${cls}</span><span class="cell-bottom">Inc: ${appData.incharges[cls] || "-"}</span></td>`;
            for (let p = 0; p < appData.totalPeriods; p++) {
                let tHere = appData.teachers.filter(t => appData.teacherRoster[t][p].class === cls);
                if (tHere.length === 0) { row += `<td class="free-cell">Free</td>`; } 
                else {
                    let cellData = tHere.map(tName => `<div style="margin-bottom:2px;"><span class="cell-top">${tName}</span><span class="cell-bottom">${appData.teacherRoster[tName][p].subject === 'None' ? '' : appData.teacherRoster[tName][p].subject}</span></div>`).join('<hr style="margin:4px 0; border:0; border-top:1px dashed #999;">');
                    row += `<td>${cellData}</td>`;
                }
            } return row + `</tr>`;
        }).join('');

        // 2. MASTER TEACHER TIMETABLE
        let teacherMasterHeaders = `<th class="dark-header" style="width:14%; color: rgba(255,255,255,0.7) !important;">Teacher Name</th>`;
        for(let p = 0; p < appData.totalPeriods; p++) teacherMasterHeaders += `<th class="dark-header">Period ${p + 1}</th>`;
        document.getElementById("thead-master-teachers").innerHTML = teacherMasterHeaders;

        document.getElementById("tbody-master-teachers").innerHTML = appData.teachers.map(t => {
            let row = `<tr><td>${t}</td>`;
            for (let p = 0; p < appData.totalPeriods; p++) {
                let duty = appData.teacherRoster[t][p];
                if (duty.class === "None" || duty.subject === "None") { 
                    row += `<td class="dash-free">-</td>`; 
                } 
                else { 
                    row += `<td>
                        <div class="subject-text">${duty.subject}</div>
                        <div class="class-pill">${duty.class}</div>
                    </td>`; 
                }
            }
            return row + `</tr>`;
        }).join('');

        // 3. INDIVIDUAL TEACHER SLIPS (4 per page)
        let splitHTML = "";
        chunkArray(appData.teachers, 4).forEach((chunk) => {
            splitHTML += `<div class="a4-paper">`;
            chunk.forEach(t => {
                let teacherHeaders = `<tr><th style="width:14%;">${t}</th>`;
                for(let p = 0; p < appData.totalPeriods; p++) teacherHeaders += `<th>Period ${p + 1}</th>`; teacherHeaders += `</tr>`;
                splitHTML += `<div class="teacher-record">
                    <div style="display:flex; justify-content:space-between; align-items:flex-end; border-bottom:2px solid #000; padding-bottom:4px; margin-bottom:8px;">
                        <span style="font-size: 16px; font-weight: 800; text-transform: uppercase; color: #000;">${appData.schoolName}</span>
                        <span style="font-size: 11px; font-weight: 600; color: #333; text-transform: uppercase;">${appData.academicSession}</span>
                    </div>
                    <table class="print-table"><thead>${teacherHeaders}</thead><tbody><tr><td><span class="cell-bottom" style="font-size:11px;">Teacher Timetable</span></td>`;
                for (let p = 0; p < appData.totalPeriods; p++) {
                    let duty = appData.teacherRoster[t][p];
                    if (duty.class === "None") { splitHTML += `<td class="free-cell">Free</td>`; } 
                    else { splitHTML += `<td><span class="cell-top">${duty.class}</span><span class="cell-bottom">${duty.subject === 'None' ? '' : duty.subject}</span></td>`; }
                }
                splitHTML += `</tr></tbody></table>
                <div class="sig-row"><div class="sig-line">Teacher Sign</div><div class="sig-line">Incharge Sign</div><div class="sig-line">Principal Sign</div></div></div>`;
            }); splitHTML += `</div>`;
        });
        document.getElementById("tbody-teachers-split").innerHTML = splitHTML;
    }
</script>
</body>
</html>
